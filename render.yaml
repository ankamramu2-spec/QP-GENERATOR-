# Render deployment blueprint.
# In the Render dashboard: New -> Blueprint -> point at this repo, and Render
# will read this file and provision both services automatically.
# (If you'd rather click through the UI manually, you can skip this file
# and just create a Web Service with "Docker" as the environment.)

services:
  - type: web
    name: qp-formatter
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: qp-formatter-db
          property: connectionString

databases:
  - name: qp-formatter-db
    plan: free
